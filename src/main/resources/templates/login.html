<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Sinh Viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page" data-theme="dark">

    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">
                <!-- Book open SVG -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            </div>
            <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.03em;">EduManage Pro</h1>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Hệ thống Quản lý Sinh viên & Điểm số</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 18px;">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" class="input-control" placeholder="Nhập username (admin / teacher1)" required autofocus autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" class="input-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                <span>Đăng Nhập</span>
            </button>
        </form>

        <div class="quick-demo-accounts">
            <p>Tài khoản dùng thử (1-Click điền):</p>
            <div class="demo-btn-group">
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillAccount('admin', 'admin123')">
                    👑 ADMIN
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillAccount('teacher1', 'teacher123')">
                    👨‍🏫 GVCN Lớp A
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillAccount('teacher2', 'teacher123')">
                    👩‍🏫 GVCN Lớp B
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        function fillAccount(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            showToast('Đã điền tài khoản: ' + user, 'success');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span>Đang xác thực...</span>';
            btn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await res.json();
                if (res.ok && result.success) {
                    showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');
                    localStorage.setItem('auth_token', result.data.token);
                    localStorage.setItem('auth_user', JSON.stringify(result.data));
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    showToast(result.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại tài khoản!', 'error');
                    resetBtn(btn);
                }
            } catch (err) {
                showToast('Không thể kết nối đến máy chủ Backend!', 'error');
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                <span>Đăng Nhập</span>
            `;
            btn.disabled = false;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
